name: Build and Release

on:
  push:
    branches:
      - FileApp-Navigation

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout code
      - name: Checkout
        uses: actions/checkout@v4

      # Step 2: Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Step 3: Install dependencies
      - name: Install dependencies
        run: npm install --force

      # Step 4: Build project
      - name: Build project
        run: npm run build

      # Step 5: Package app in /tmp (safe, avoids tar-included-itself error)
      - name: Package app
        run: |
          tar --exclude='node_modules' \
              --exclude='tests' \
              --exclude='.git' \
              --exclude='dist' \
              -czf /tmp/scaleinfinite-nextcloud-all.tar.gz .

      # Step 6: Create GitHub release
      - name: Create Release
        id: create_release
        uses: ncipollo/release-action@v1
        with:
          tag: v${{ github.run_number }}
          name: Release v${{ github.run_number }}
          generateReleaseNotes: true
          allowUpdates: true
          replacesArtifacts: true

      # Step 7: Upload release asset from /tmp
      - name: Upload Release Asset
        run: |
          gh release upload v${{ github.run_number }} /tmp/scaleinfinite-nextcloud-all.tar.gz --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
