name: Build and Release Nextcloud

on:
  workflow_dispatch: # manual trigger
  push:
    branches:
      - FileApp-Navigation   # replace with the branch you want to release

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Create working directory
        run: mkdir -p nextcloud-src

      - name: Checkout Nextcloud specific branch
        uses: actions/checkout@v4
        with:
          ref:  FileApp-Navigation         # branch to build
          path: nextcloud-src

      - name: Clone 3rdparty repo
        run: |
          cd nextcloud-src
          rm -rf 3rdparty
          git clone https://github.com/nextcloud/3rdparty.git 3rdparty
          cd 3rdparty
          git checkout e153540bcc9c2dca7742763e071b07b97d3d55b8

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies and build
        run: |
          cd nextcloud-src
          npm install
          npm run build

      - name: Create tarball (exclude .git dirs, include only nextcloud-src)
        run: |
          tar --exclude='nextcloud-src/.git' \
              --exclude='nextcloud-src/3rdparty/.git' \
              -czf nextcloud-build.tar.gz nextcloud-src

      - name: Upload Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}   # auto-generate tag
          name: Nextcloud Build ${{ github.run_number }}
          files: nextcloud-build.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}